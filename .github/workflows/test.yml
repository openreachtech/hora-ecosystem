name: Node.js CI

on:
  pull_request:
    branches:
      - '**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: [self-hosted, light]

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: 🛎 Checkout repository code
        uses: actions/checkout@v4

      - name: 🏗 Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'
          node-version: ${{ matrix.node-version }}
          registry-url: https://npm.pkg.github.com

      # ⚠️ This gate runs before npm ci because npm audit resolves the tree from
      # package-lock.json alone and needs no node_modules. Putting the cheapest check
      # first keeps a vulnerable dependency tree from paying for an install and a test run.
      - name: 🛡 npm audit
        run: npm audit

      - name: 📦 Install packages
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.TO_REPO_OF_ORT_PRIVATE }}

      - name: 🧵 ESLint
        run: npm run lint

      - name: 🧪 Jest
        env:
          NODE_ENV: development
        run: npm test
